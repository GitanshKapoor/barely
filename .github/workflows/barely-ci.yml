name: Barely CI

# Manual trigger only - No automated pipeline runs on push or PR in this repository
on:
  workflow_dispatch:

jobs:
  frontend-checks:
    name: Frontend (Next.js) Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/ui/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Check Types & Lint
        run: npm run lint --if-present
      - name: Build Next.js App
        run: npm run build

  docker-integration:
    name: Docker Infrastructure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker Compose Build
        run: docker compose build
        
  security-scan:
    name: Basic Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
