apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "barely.fullname" . }}-api
  labels:
    {{- include "barely.api.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "barely.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "barely.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.execution.serviceAccount.name | default "barely-job-spawner" }}
      securityContext:
        runAsNonRoot: {{ .Values.security.runAsNonRoot | default true }}
        runAsUser: {{ .Values.security.runAsUser | default 10001 }}
        runAsGroup: {{ .Values.security.runAsGroup | default 10001 }}
        fsGroup: {{ .Values.security.fsGroup | default 10001 }}
        seccompProfile:
          type: {{ .Values.security.seccompProfile.type | default "RuntimeDefault" }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - /opt/.venv/bin/uvicorn
            - barely_api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --app-dir
            - packages/api/src
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: {{ .Values.security.allowPrivilegeEscalation | default false }}
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem | default false }}
            capabilities:
              drop:
                {{- toYaml .Values.security.capabilities.drop | nindent 16 }}
          envFrom:
            - configMapRef:
                name: {{ include "barely.fullname" . }}-config
          env:
            - name: DATABASE_URL
              {{- if .Values.database.inCluster.enabled }}
              value: "postgresql://{{ .Values.database.inCluster.user }}:{{ .Values.database.inCluster.password }}@{{ include "barely.fullname" . }}-db:5432/{{ .Values.database.inCluster.database }}"
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.external.secretName | default "barely-db-secret" }}
                  key: {{ .Values.database.external.secretKey | default "url" }}
              {{- end }}
            - name: BARELY_SECRETS_DIR
              value: "/etc/secrets/barely"
            - name: BARELY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name | default "barely-secrets" }}
                  key: barely_secret_key
                  optional: true
          volumeMounts:
            - name: secrets-volume
              mountPath: /etc/secrets/barely
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
          {{- with .Values.api.probes }}
          {{- if .startup }}
          startupProbe:
            httpGet:
              path: {{ .startup.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .startup.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .startup.periodSeconds | default 5 }}
            failureThreshold: {{ .startup.failureThreshold | default 30 }}
          {{- end }}
          {{- if .liveness }}
          livenessProbe:
            httpGet:
              path: {{ .liveness.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .liveness.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .liveness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .liveness.timeoutSeconds | default 5 }}
            failureThreshold: {{ .liveness.failureThreshold | default 3 }}
          {{- end }}
          {{- if .readiness }}
          readinessProbe:
            httpGet:
              path: {{ .readiness.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .readiness.periodSeconds | default 5 }}
            timeoutSeconds: {{ .readiness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .readiness.failureThreshold | default 2 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: secrets-volume
          secret:
            secretName: {{ .Values.secrets.name | default "barely-secrets" }}
            optional: true
        - name: tmp-dir
          emptyDir: {}
