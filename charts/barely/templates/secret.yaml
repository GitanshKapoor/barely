{{- if not .Values.externalSecrets.enabled }}
{{- if .Values.database.external.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.external.secretName | default "barely-db-secret" }}
  labels:
    {{- include "barely.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.database.external.url | quote }}
---
{{- end }}
{{- if .Values.secrets.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | default "barely-secrets" }}
  labels:
    {{- include "barely.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.data.anthropicApiKey }}
  anthropic_api_key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.openaiApiKey }}
  openai_api_key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.geminiApiKey }}
  gemini_api_key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.jiraApiToken }}
  jira_api_token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.data.slackWebhookUrl }}
  slack_webhook_url: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
