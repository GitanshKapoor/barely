[project]
name = "barely"
version = "0.1.0"
description = "Barely is an open-source AI agent for end-to-end web testing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.3",
    "playwright>=1.47.0",
    "litellm>=1.44.0",
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
    "markdown>=3.7",
    "jinja2>=3.1.4",
]

[project.scripts]
barely = "barely.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
