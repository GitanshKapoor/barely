[project]
name = "barely-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.3",
    "barely-core"
]

[project.scripts]
barely = "barely_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
barely-core = { workspace = true }
