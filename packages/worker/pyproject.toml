[project]
name = "barely-worker"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "barely-core"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barely_worker"]

[tool.uv.sources]
barely-core = { workspace = true }
