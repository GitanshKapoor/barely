# ==============================================================================
# Barely - Production Docker Compose Deployment
# Hardened: Isolated networks, Non-root execution, No exposed DB host ports,
# Chromium 1GB /dev/shm, Standalone UI container, Built-in Healthchecks.
# ==============================================================================

services:
  barely-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barelypassword}
      POSTGRES_DB: ${POSTGRES_DB:-barelydb}
    # Security: Database is strictly internal; NO host ports published.
    expose:
      - "5432"
    volumes:
      - barely_pgdata:/var/lib/postgresql/data
    networks:
      - barely_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barely} -d ${POSTGRES_DB:-barelydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  barely-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      barely-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-barely}:${POSTGRES_PASSWORD:-barelypassword}@barely-db:5432/${POSTGRES_DB:-barelydb}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    networks:
      - barely_frontend
      - barely_backend
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  barely-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      barely-db:
        condition: service_healthy
      barely-api:
        condition: service_healthy
    # Shared memory allocation required for Chromium stability in headless mode
    shm_size: '1gb'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-barely}:${POSTGRES_PASSWORD:-barelypassword}@barely-db:5432/${POSTGRES_DB:-barelydb}
      - API_URL=http://barely-api:8000
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    # Security: Worker accepts zero inbound traffic from host
    networks:
      - barely_backend
      - barely_runner
    env_file:
      - path: .env
        required: false

  barely-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    depends_on:
      barely-api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://barely-api:8000
    ports:
      - "3000:3000"
    networks:
      - barely_frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # Public ingress tier connecting UI and API
  barely_frontend:
    driver: bridge
  # Internal tier isolating Database and backend services (no UI access to DB)
  barely_backend:
    driver: bridge
    internal: false
  # Outbound tier for worker executing tests against target websites
  barely_runner:
    driver: bridge

volumes:
  barely_pgdata:
    driver: local
