[project]
name = "barely-reporter-pdf"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "reportlab",
    "barely-core"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
barely-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/barely_pdf"]
